[project]
name = "firmware-agent"
version = "0.1.0"
description = "OpenHands plugin for firmware development (MCU, pin map, peripherals, power modes) gated by build, netlist match, flash/RAM budget, static analysis, and QEMU simulation"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "mcp>=1.29,<2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9",
    "pytest-cov==7.1.0",
    "pytest-xdist>=3",
    "ruff>=0.16",
]
sdk-check = ["openhands-sdk==1.52.0", "openhands-tools==1.52.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firmware"]

[tool.uv]
required-version = "==0.12.23"
default-groups = ["dev", "sdk-check"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.format]
# Family-canonical files are byte-identical across repos (formatted at 88).
exclude = [
  "scripts/mutation_probe.py",
  "scripts/structural_coverage.py",
  "tests/test_mutation_probe.py",
  "tests/test_structural_coverage.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
    "src",
    "scripts",
    "tests",
    "plugins/firmware/hooks/scripts",
    "plugins/firmware/scripts",
]
exclude = ["**/__pycache__", ".venv", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto --dist loadgroup"
pythonpath = ["."]

[tool.coverage.run]
source = ["src/firmware"]
branch = true

[tool.vibebb-coverage]
# Ratchet floors (percent) for scripts/structural_coverage.py, measured on
# main minus one point for interpreter variance. Raise them, never lower.
c0 = 84
c1 = 72
decision = 65
c2 = 62
mcdc = 41
boundary = 45

[tool.vibebb-mutation]
# Advisory weekly mutation probe (scripts/mutation_probe.py); never a gate.
targets = ["src/firmware/gates.py", "src/firmware/elf.py"]
tests = ["tests/test_gates.py", "tests/test_gate_boundaries.py"]
max_mutants = 400

[tool.coverage.report]
fail_under = 82
