name: Publish firmware images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".dockerignore"
      - "src/**"
      - "plugins/firmware/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/measure_image_tools.py"
      - "scripts/print_locked_image.py"
      - "scripts/pull_locked_image.py"
      - "scripts/update_image_digest_lock.py"
      - ".github/workflows/publish-firmware-images.yml"
      - "!docker/image-digests.json"
      # The plugin pin is written by this workflow itself; exclude it so a
      # merged pin PR does not trigger another publish.
      - "!plugins/firmware/tools-image.json"
      - "!docker/README.md"
  workflow_dispatch:

concurrency:
  group: publish-firmware-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      # Approves action_required pull_request runs on the lock branch.
      actions: write
      # Pushes the bot digest-lock branch.
      contents: write
      # Pushes the firmware-tools image to ghcr.io.
      packages: write
      id-token: write # OIDC for build-provenance attestation
      attestations: write # stores the attestation
      # Opens and auto-merges the digest-lock pull request.
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-suffix: publish
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Build and publish tools
        id: tools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/firmware-tools.Dockerfile
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/firmware-tools:${{ github.sha }}-tools
            ghcr.io/${{ env.IMAGE_OWNER }}/firmware-tools:latest
          cache-from: type=gha
          # A failed cache export must not fail the publish; gha cache
          # imports already degrade to a miss rather than an error, so
          # ignore-error applies to cache-to only.
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Attest tools image provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/vibebb/firmware-tools
          subject-digest: ${{ steps.tools.outputs.digest }}
          push-to-registry: true
      - name: Resolve tools digest
        env:
          BUILT_DIGEST: ${{ steps.tools.outputs.digest }}
        run: |
          set -euo pipefail
          case "$BUILT_DIGEST" in sha256:*) ;; *) echo "invalid tools digest: $BUILT_DIGEST" >&2; exit 1 ;; esac
          TOOLS_REF="ghcr.io/${IMAGE_OWNER}/firmware-tools@${BUILT_DIGEST}"
          TOOLS_TAG="${GITHUB_SHA}-tools"
          printf 'TOOLS_REF=%s\nTOOLS_DIGEST=%s\nTOOLS_TAG=%s\n' "$TOOLS_REF" "${TOOLS_REF##*@}" "$TOOLS_TAG" >> "$GITHUB_ENV"
      - name: Generate tools SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.TOOLS_REF }}
          format: spdx-json
          output-file: ${{ runner.temp }}/firmware-tools.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Validate tools SPDX SBOM
        run: |
          python3 - "${{ runner.temp }}/firmware-tools.spdx.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          sbom = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if sbom.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit("tools SBOM must use SPDX-2.3")
          PY
      - name: Attest tools SBOM
        id: attest_sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/vibebb/firmware-tools
          subject-digest: ${{ steps.tools.outputs.digest }}
          sbom-path: ${{ runner.temp }}/firmware-tools.spdx.json
          push-to-registry: true
      - name: Upload tools SPDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-tools-spdx-sbom
          path: ${{ runner.temp }}/firmware-tools.spdx.json
          retention-days: 30
      - name: Measure published tools
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
        run: uv run python scripts/measure_image_tools.py --image-ref "$TOOLS_REF" --out "$RUNNER_TEMP/firmware-tools.json"
      - name: Verify published tools smoke
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
        run: |
          set -euo pipefail
          docker pull "$TOOLS_REF"
          export FIRMWARE_TOOLS_IMAGE="$TOOLS_REF"
          export FIRMWARE_SRC="$GITHUB_WORKSPACE/src"
          export OPENHANDS_PROJECT_DIR="$GITHUB_WORKSPACE"
          launcher=plugins/firmware/scripts/firmware_launcher.py
          python3 "$launcher" doctor | tee doctor.json
          for contract in examples/smart-kettle/smart-kettle.fw.json examples/desk-lamp-s3/desk-lamp.fw.json; do
            design=$(basename "$contract" .fw.json)
            out="$(dirname "$contract")/fw-reports"
            mkdir -p "$out"
            stdout="$out/$design.stdout.json"
            report="$out/$design.fw-report.json"
            set +e
            python3 "$launcher" gates "$contract" > "$stdout"
            status=$?
            set -e
            python3 - "$report" "$stdout" "$status" <<'PY'
          import json, sys
          from pathlib import Path

          report_path, stdout_path = map(Path, sys.argv[1:3])
          status = int(sys.argv[3])
          if report_path.is_file():
              report = json.loads(report_path.read_text(encoding="utf-8"))
              for check in report["checks"]:
                  print(f"{check['id']:24} {check['status']:8} {check['detail'][:200]}")
          else:
              stdout_text = stdout_path.read_text(encoding="utf-8")
              print(stdout_text, end="")
              report = json.loads(stdout_text)
          sys.exit(1 if status != 0 or report.get("verdict") != "pass" else 0)
          PY
          done
          debug_json=examples/desk-lamp-s3/fw-reports/desk-lamp.debug.json
          python3 "$launcher" debug examples/desk-lamp-s3/desk-lamp.fw.json \
            --id lamp_selftest --break lamp_step > "$debug_json"
          python3 - "$debug_json" <<'PY'
          import json, sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(data["verdict"], data.get("stops"))
          sys.exit(0 if data["verdict"] == "pass" and data.get("stops") else 1)
          PY
      - name: Upload published image smoke reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-publish-smoke
          path: |
            doctor.json
            examples/*/fw-reports/*.fw-report.json
            examples/*/fw-reports/*.stdout.json
            examples/*/fw-reports/*.debug.json
            examples/*/fw-reports/sim-*.log
            examples/*/fw-reports/debug-*.advisory.json
            examples/*/fw-reports/*.fw-pinmap.json
            examples/*/fw-reports/*.pinmap.md
          if-no-files-found: ignore
      - name: Record published image summary
        run: |
          {
            echo "## firmware images"
            echo
            echo "- **tools**: \`$TOOLS_REF\`"
            echo "- **tools digest**: \`$TOOLS_DIGEST\`"
            echo "- **tools tag**: \`$TOOLS_TAG\`"
            echo "- **workflow run**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Update digest lock and merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          SBOM_ATTESTATION_URL: ${{ steps.attest_sbom.outputs.attestation-url }}
        run: |
          set -euo pipefail
          retry() {
            # Transient GitHub API/server errors (HTTP 5xx, TLS resets,
            # truncated responses) should not hard-fail a multi-minute
            # publish: retry gh/git calls with backoff before giving up.
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          dispatch_workflow() {
            # GITHUB_TOKEN-driven push/pull_request events never produce a real gate:
            # at most a stillborn pull_request run is recorded (cancelled before merge
            # below), so CI for the lock branch and the checks after the merge is
            # started explicitly.
            local workflow="$1" ref="$2" started run_id=""
            shift 2
            # Reset per-call so a previous dispatch's conclusion cannot leak
            # into the summary when this run is not observed.
            DISPATCH_RUN_URL=""
            DISPATCH_CONCLUSION=""
            started=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            retry gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$ref" "$@"
            for _ in $(seq 1 30); do
              sleep 10
              run_id=$(retry gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$ref" \
                --event workflow_dispatch --created ">=$started" --json databaseId --jq '.[0].databaseId // empty' || true)
              [ -n "$run_id" ] && break
            done
            if [ -z "$run_id" ]; then
              echo "workflow_dispatch of $workflow for $ref was not observed" >&2
              return 1
            fi
            DISPATCH_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            echo "$workflow run for $ref: ${DISPATCH_RUN_URL}"
            gh run watch --repo "$GITHUB_REPOSITORY" "$run_id" --interval 30 || true
            # An empty conclusion is a transient API failure, not a run
            # verdict: re-query until the API reports the conclusion.
            DISPATCH_CONCLUSION=""
            for _ in $(seq 1 6); do
              DISPATCH_CONCLUSION=$(retry gh run view --repo "$GITHUB_REPOSITORY" "$run_id" \
                --json conclusion --jq '.conclusion // empty' || true)
              [ -n "$DISPATCH_CONCLUSION" ] && break
              sleep 10
            done
            DISPATCH_CONCLUSION="${DISPATCH_CONCLUSION:-unknown}"
            echo "$workflow conclusion for $ref: ${DISPATCH_CONCLUSION}"
            [ "$DISPATCH_CONCLUSION" = "success" ]
          }
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          workflow_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The lock branch starts from the current main tip, not from the published
          # source commit, so the PR stays mergeable when main moved during the build.
          git fetch -q origin main
          base_sha=$(git rev-parse origin/main)
          branch="bot/update-image-digests-${TOOLS_DIGEST#sha256:}"
          branch="${branch:0:70}"
          git switch -q -c "$branch" "$base_sha"
          uv run python scripts/update_image_digest_lock.py --lock docker/image-digests.json \
            --entry firmware_tools --image "ghcr.io/${IMAGE_OWNER}/firmware-tools" \
            --tag "$TOOLS_TAG" --digest "$TOOLS_DIGEST" --published-at "$published_at" \
            --workflow-run "$workflow_run" --dockerfile docker/firmware-tools.Dockerfile \
            --attestation "$ATTESTATION_URL" \
            --sbom-attestation "$SBOM_ATTESTATION_URL" \
            --tools-json "$RUNNER_TEMP/firmware-tools.json"
          # Ship the same pin inside the plugin so an installed plugin can
          # resolve the tools image without the extension cache (the
          # launcher reads <plugin>/tools-image.json first).
          python3 - <<'PY'
          import json

          entry = json.load(open("docker/image-digests.json"))["firmware_tools"]
          pin = "plugins/firmware/tools-image.json"
          with open(pin, "w", encoding="utf-8") as out:
              json.dump(entry, out, indent=2)
              out.write("\n")
          PY
          # status --porcelain (not diff --quiet) so a still-untracked lock
          # file on the very first publish is detected as a change too.
          if [ -z "$(git status --porcelain -- docker/image-digests.json plugins/firmware/tools-image.json)" ]; then
            echo "Image digest lock is unchanged; no pull request is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker/image-digests.json plugins/firmware/tools-image.json
          git commit -m "Update firmware image digest lock"
          retry git push --set-upstream origin "$branch"
          body=$(printf '%s\n' \
            "The publish workflow updated the firmware image digest lock." \
            "" \
            "tools: ${TOOLS_REF}" \
            "workflow run: ${workflow_run}")
          # A stale bot PR from an earlier publish is superseded by this
          # run's digest: close it and delete its branch so it cannot
          # linger for manual review.
          for old_pr in $(retry gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName --jq '.[] | select(.headRefName | startswith("bot/update")) | .number' || true); do
            retry gh pr close "$old_pr" --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --delete-branch || true
          done
          pr_url=$(retry gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Update firmware image digest lock" --body "$body")
          # pull_request-triggered runs on the bot branch (ci.yml, workflow
          # lint, ...) can land as action_required under an approval-gated
          # Actions policy. Their check suites become the newest
          # github-actions suites on the head SHA, and a required check
          # stuck at action_required blocks the merge just like a failure
          # does — so approve every gated run for this branch (this job has
          # actions: write). Runs appear asynchronously; poll briefly.
          approve_gated_runs() {
            retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=action_required&per_page=100" \
              --jq ".workflow_runs[] | select(.head_branch==\"$branch\") | .id" \
              | while read -r run_id; do
                  retry gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" || true
                done
          }
          approve_gated_runs
          if ! dispatch_workflow ci.yml "$branch"; then
            echo "lock PR checks failed; the lock PR was left open for manual review" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! dispatch_workflow workflow-lint.yml "$branch"; then
            echo "lock PR zizmor check failed; the lock PR was left open for manual review" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Wait for every pull_request run on the lock branch to reach a
          # conclusion: they are the check suites the ruleset's required
          # checks read. A stillborn run never starts jobs; it sits in
          # startup until the branch-deleting merge kills it with a spurious
          # "workflow file issue" failure, so it is cancelled once nothing
          # else is pending. An approved-but-still-pending run keeps the
          # loop going instead.
          pr_checks_ok=false
          for _ in $(seq 1 36); do
            # Runs can surface gated later than the initial sweep, so keep
            # approving while waiting.
            approve_gated_runs
            pending=$(retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&event=pull_request&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == null)] | length' || echo 1)
            if [ "$pending" -eq 0 ]; then
              pr_checks_ok=true
              break
            fi
            sleep 10
          done
          if [ "$pr_checks_ok" != true ]; then
            for run_id in $(retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&event=pull_request&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == null) | .id' || true); do
              jobs=$(retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=1" \
                --jq '.total_count // 0' || echo 0)
              if [ "$jobs" -eq 0 ]; then
                retry gh run cancel --repo "$GITHUB_REPOSITORY" "$run_id" || true
              fi
            done
            pending_after=$(retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&event=pull_request&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == null)] | length' || echo 1)
            [ "$pending_after" -eq 0 ] && pr_checks_ok=true
          fi
          # Only hard failures block: skipped/neutral/cancelled conclusions
          # are benign (a required check that ended cancelled still blocks
          # the merge call itself, so this stays fail-closed).
          bad=$(retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&event=pull_request&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral" and .conclusion != "cancelled")] | length' || echo 1)
          if [ "$pr_checks_ok" != true ] || [ "$bad" -gt 0 ]; then
            echo "lock PR pull_request checks did not all pass (pending=${pr_checks_ok}, non-success=${bad}); the lock PR was left open for manual review" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # --auto arms auto-merge so required checks that are still
          # registering do not fail the merge call; when every required
          # check is already green it merges at once.
          if ! retry gh pr merge --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch "$pr_url"; then
            echo "lock PR merge was blocked; the lock PR was left open for manual review" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # The merge may only be armed: wait for it to land before the
          # observational post-merge dispatches. A still-pending PR after the
          # wait merges on its own once checks pass, so that is not a failure.
          merged=false
          for _ in $(seq 1 36); do
            merged_at=$(retry gh api "repos/$GITHUB_REPOSITORY/pulls/${pr_url##*/}" --jq '.merged_at // empty' || true)
            [ -n "$merged_at" ] && { merged=true; break; }
            sleep 10
          done
          if [ "$merged" != true ]; then
            # Auto-merge can stay armed indefinitely even with every required
            # check green when the arm races the last check completion and no
            # further check event triggers a re-evaluation. A direct merge is
            # still gated by the branch ruleset, so it can only land when the
            # required checks actually pass; on failure the armed auto-merge
            # is left in place for GitHub to resolve later.
            if retry gh pr merge --repo "$GITHUB_REPOSITORY" --squash --delete-branch "$pr_url"; then
              merged=true
            else
              echo "auto-merge is armed on $pr_url and a direct merge attempt was blocked; the lock PR was left open for manual review" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          # Post-merge verification is fire-and-forget: the workflows are
          # dispatched on main and their run URLs recorded, but this job does
          # not wait for them — main-ci-failure-issue.yml watches completed
          # main runs and files a tracking issue on any failure.
          for wf in ci.yml locked-image-check.yml; do
            started=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            retry gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref main || continue
            run_id=""
            for _ in $(seq 1 6); do
              sleep 10
              run_id=$(retry gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --branch main \
                --event workflow_dispatch --created ">=$started" --json databaseId --jq '.[0].databaseId // empty' || true)
              [ -n "$run_id" ] && break
            done
            if [ -n "$run_id" ]; then
              echo "post-merge ${wf} run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "post-merge ${wf} dispatch was not observed on main" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "::notice::post-merge verification for ${pr_url} is delegated to main-ci-failure-issue"
