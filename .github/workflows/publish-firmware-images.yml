name: Publish firmware images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".dockerignore"
      - "src/**"
      - "plugins/firmware/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/measure_image_tools.py"
      - "scripts/print_locked_image.py"
      - "scripts/pull_locked_image.py"
      - "scripts/update_image_digest_lock.py"
      - ".github/workflows/publish-firmware-images.yml"
      - "scripts/publish_image_pin_pr.sh"
      - "scripts/package_level_sbom.py"
      - "!docker/image-digests.json"
      # The plugin pin is written by this workflow itself; exclude it so a
      # merged pin PR does not trigger another publish.
      - "!plugins/firmware/tools-image.json"
      - "!docker/README.md"
  # dry_run=true rehearses the gate chain (Trivy scans, SBOM chain, tool
  # measurement, launcher smoke) against the locally loaded image while
  # push, :latest promotion, attestations, code-scanning SARIF, and the
  # digest-lock PR stay skipped.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rehearse the gate chain without publishing or locking
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-firmware-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      # Approves action_required pull_request runs on the lock branch.
      actions: write
      # Pushes the bot digest-lock branch.
      contents: write
      # Pushes the firmware-tools image to ghcr.io.
      packages: write
      id-token: write # OIDC for build-provenance attestation
      attestations: write # stores the attestation
      artifact-metadata: write # creates the attestation storage record
      # Opens and auto-merges the digest-lock pull request.
      pull-requests: write
      security-events: write # uploads the Trivy SARIF scan to code scanning
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: publish
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Build and publish tools
        id: tools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/firmware-tools.Dockerfile
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
          # dry_run loads the image into the local daemon (single-platform
          # build) instead of pushing so the gate chain can rehearse it.
          push: ${{ inputs.dry_run != true }}
          load: ${{ inputs.dry_run == true }}
          # Immutable tag only: a failing image must never serve :latest;
          # the tag is promoted after every gate passes.
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/firmware-tools:${{ github.sha }}-tools
          # Share the e2e job's cache scope: a publish minutes after a
          # main e2e build otherwise rebuilds ~10min from near-cold.
          cache-from: type=gha,scope=firmware-tools
          # A failed cache export must not fail the publish; gha cache
          # imports already degrade to a miss rather than an error, so
          # ignore-error applies to cache-to only.
          cache-to: type=gha,mode=max,scope=firmware-tools,ignore-error=true
      - name: Resolve Trivy DB cache key
        id: trivy_week
        run: |
          echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"
          # Shared by all Trivy invocations in this job; the actions/cache
          # step below restores the DB saved by container-audit.
          echo "TRIVY_CACHE_DIR=$HOME/.cache/trivy" >> "$GITHUB_ENV"
      - name: Restore Trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          # ISO-week key: the vulnerability DB refreshes daily upstream;
          # a weekly key bounds staleness while sharing the ~120MB
          # download across scans and publish runs. lookup-only: this job
          # publishes artifacts, so it must never write the cache —
          # container-audit keeps it warm.
          key: trivy-db-${{ runner.os }}-${{ steps.trivy_week.outputs.week }}
          restore-keys: |
            trivy-db-${{ runner.os }}-
          lookup-only: true
      - name: Resolve scan image reference
        id: scan-ref
        env:
          BUILT_DIGEST: ${{ steps.tools.outputs.digest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Push runs scan the exact pushed digest — the content the SBOM
          # and provenance attestations bind to. A dry_run build only loads
          # into the local daemon, so retag it under a slash-free local name
          # the measurement probes also accept.
          if [ "$DRY_RUN" = "true" ]; then
            docker tag \
              "ghcr.io/${IMAGE_OWNER}/firmware-tools:${GITHUB_SHA}-tools" \
              "firmware-tools:${GITHUB_SHA}-rehearsal"
            echo "ref=firmware-tools:${GITHUB_SHA}-rehearsal" >> "$GITHUB_OUTPUT"
          else
            echo "ref=ghcr.io/${IMAGE_OWNER}/firmware-tools@${BUILT_DIGEST}" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve tools digest
        env:
          BUILT_DIGEST: ${{ steps.tools.outputs.digest }}
          SCAN_IMAGE_REF: ${{ steps.scan-ref.outputs.ref }}
        run: |
          set -euo pipefail
          case "$BUILT_DIGEST" in sha256:*) ;; *) echo "invalid tools digest: $BUILT_DIGEST" >&2; exit 1 ;; esac
          # The pushed digest reference on publish; the local rehearsal tag
          # on dry_run.
          TOOLS_TAG="${GITHUB_SHA}-tools"
          printf 'TOOLS_REF=%s\nTOOLS_DIGEST=%s\nTOOLS_TAG=%s\n' "$SCAN_IMAGE_REF" "$BUILT_DIGEST" "$TOOLS_TAG" >> "$GITHUB_ENV"
      - name: Scan tools image (Trivy SARIF)
        id: trivy-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          # Scan the exact pushed digest — the content the SBOM and
          # provenance attestations bind to (the rehearsal tag in dry_run).
          scan-ref: ${{ steps.scan-ref.outputs.ref }}
          version: v0.75.0
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
      # Attestation only needs the pushed digest: run it as a background
      # step overlapping every post-gate leg and join it before the
      # :latest promotion that consumes the attested image.
      - name: Attest tools image provenance
        if: inputs.dry_run != true
        id: attest
        background: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.IMAGE_OWNER }}/firmware-tools
          subject-digest: ${{ steps.tools.outputs.digest }}
          push-to-registry: true
      # Independent post-build legs run as a parallel group (implicit wait
      # at the end). On a SARIF-gate failure the JSON leg still runs under
      # its always() so the diagnostic report exists exactly when needed,
      # while the SBOM and measure legs keep their implicit success() skip.
      - parallel:
          - name: Scan tools image (Trivy JSON)
            # Runs even when the SARIF gate above found fixable CVEs, so the
            # full report is still emitted on a gate failure.
            if: always() && steps.tools.outcome == 'success'
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
            with:
              scan-type: image
              scan-ref: ${{ steps.scan-ref.outputs.ref }}
              version: v0.75.0
              scanners: vuln,secret,misconfig,license
              ignore-unfixed: false
              exit-code: '0'
              format: json
              output: trivy-image.json
              skip-setup-trivy: true
          - name: Generate tools SPDX SBOM
            uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
            env:
              # Registry pulls on publish; a dry_run image exists only in the
              # local docker daemon.
              SYFT_SOURCE_IMAGE_DEFAULT_PULL_SOURCE: ${{ inputs.dry_run == true && 'docker' || 'registry' }}
              TMPDIR: ${{ runner.temp }}
              SYFT_FILE_METADATA_SELECTION: none
            with:
              image: ${{ env.TOOLS_REF }}
              format: spdx-json
              output-file: ${{ runner.temp }}/firmware-tools.full.spdx.json
              upload-artifact: false
              upload-release-assets: false
          - name: Measure published tools
            env:
              TOOLS_REF: ${{ env.TOOLS_REF }}
            run: uv run python scripts/measure_image_tools.py --image-ref "$TOOLS_REF" --out "$RUNNER_TEMP/firmware-tools.json"
      - name: Report gating CVEs
        # A SARIF gate failure otherwise surfaces only as an exit code;
        # list the fixable HIGH/CRITICAL findings that blocked the publish.
        if: always() && steps.trivy-scan.outcome == 'failure' && hashFiles('trivy-image.json') != ''
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open("trivy-image.json", encoding="utf-8"))
          rows = [
              (v["VulnerabilityID"], v.get("PkgName", "?"), v["Severity"], v["FixedVersion"])
              for result in data.get("Results", [])
              for v in result.get("Vulnerabilities") or []
              if v.get("Severity") in ("CRITICAL", "HIGH") and v.get("FixedVersion")
          ]
          print("## Trivy SARIF gate failures\n")
          print("| Vulnerability | Package | Severity | Fixed in |")
          print("|---|---|---|---|")
          for row in rows:
              print("| " + " | ".join(row) + " |")
          PY
      - name: Upload Trivy SARIF
        # A rehearsal must not file code-scanning alerts.
        if: always() && inputs.dry_run != true && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-firmware-tools
      - name: Upload Trivy JSON report
        if: always() && hashFiles('trivy-image.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-tools-trivy
          path: trivy-image.json
          retention-days: 90
      - name: Package tools SPDX SBOM
        run: |
          python3 scripts/package_level_sbom.py \
            "$RUNNER_TEMP/firmware-tools.full.spdx.json" \
            "$RUNNER_TEMP/firmware-tools.spdx.json"
      - name: Guard tools SPDX SBOM size
        env:
          SBOM_PATH: ${{ runner.temp }}/firmware-tools.spdx.json
        run: |
          set -euo pipefail
          df -h /tmp "$RUNNER_TEMP"
          size=$(stat -c%s "$SBOM_PATH")
          echo "SBOM size: ${size} bytes"
          if [ "$size" -gt 16777216 ]; then
            echo "::error::SBOM exceeds 16777216 bytes: ${size} bytes"
            exit 1
          fi

      - name: Validate tools SPDX SBOM
        run: |
          python3 - "${{ runner.temp }}/firmware-tools.spdx.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          sbom = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if sbom.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit("tools SBOM must use SPDX-2.3")
          PY
      # The SBOM attestation only needs the packaged SBOM: run it as a
      # background step overlapping the upload + smoke legs and join it
      # before the :latest promotion.
      - name: Attest tools SBOM
        if: inputs.dry_run != true
        id: attest_sbom
        background: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.IMAGE_OWNER }}/firmware-tools
          subject-digest: ${{ steps.tools.outputs.digest }}
          sbom-path: ${{ runner.temp }}/firmware-tools.spdx.json
          push-to-registry: true
      - name: Upload full tools SPDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-tools-spdx-sbom
          path: ${{ runner.temp }}/firmware-tools.full.spdx.json
          retention-days: 90
          if-no-files-found: error
      - name: Verify published tools smoke
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # A dry_run image already exists in the local daemon; there is no
          # registry ref to pull.
          if [ "$DRY_RUN" != "true" ]; then
            for attempt in 1 2 3 4 5; do
              if docker pull "$TOOLS_REF"; then break; fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::docker pull $TOOLS_REF failed after 5 attempts" >&2
                exit 1
              fi
              echo "docker pull attempt $attempt failed; retrying" >&2
              sleep $((attempt * 10))
            done
          fi
          export FIRMWARE_TOOLS_IMAGE="$TOOLS_REF"
          export FIRMWARE_SRC="$GITHUB_WORKSPACE/src"
          export OPENHANDS_PROJECT_DIR="$GITHUB_WORKSPACE"
          launcher=plugins/firmware/scripts/firmware_launcher.py
          python3 "$launcher" doctor | tee doctor.json
          for contract in examples/smart-kettle/smart-kettle.fw.json examples/desk-lamp-s3/desk-lamp.fw.json; do
            design=$(basename "$contract" .fw.json)
            out="$(dirname "$contract")/fw-reports"
            mkdir -p "$out"
            stdout="$out/$design.stdout.json"
            report="$out/$design.fw-report.json"
            set +e
            python3 "$launcher" gates "$contract" > "$stdout"
            status=$?
            set -e
            python3 - "$report" "$stdout" "$status" <<'PY'
          import json, sys
          from pathlib import Path

          report_path, stdout_path = map(Path, sys.argv[1:3])
          status = int(sys.argv[3])
          if report_path.is_file():
              report = json.loads(report_path.read_text(encoding="utf-8"))
              for check in report["checks"]:
                  print(f"{check['id']:24} {check['status']:8} {check['detail'][:200]}")
          else:
              stdout_text = stdout_path.read_text(encoding="utf-8")
              print(stdout_text, end="")
              report = json.loads(stdout_text)
          sys.exit(1 if status != 0 or report.get("verdict") != "pass" else 0)
          PY
          done
          debug_json=examples/desk-lamp-s3/fw-reports/desk-lamp.debug.json
          python3 "$launcher" debug examples/desk-lamp-s3/desk-lamp.fw.json \
            --id lamp_selftest --break lamp_step > "$debug_json"
          python3 - "$debug_json" <<'PY'
          import json, sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(data["verdict"], data.get("stops"))
          sys.exit(0 if data["verdict"] == "pass" and data.get("stops") else 1)
          PY
      - name: Upload published image smoke reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-publish-smoke
          path: |
            doctor.json
            examples/*/fw-reports/*.fw-report.json
            examples/*/fw-reports/*.stdout.json
            examples/*/fw-reports/*.debug.json
            examples/*/fw-reports/sim-*.log
            examples/*/fw-reports/debug-*.advisory.json
            examples/*/fw-reports/*.fw-pinmap.json
            examples/*/fw-reports/*.pinmap.md
          if-no-files-found: ignore
      - name: Wait for attestations
        wait: [attest, attest_sbom]
      - name: Promote :latest
        # Every gate above passed: copy the verified manifest to :latest
        # server-side (attestations and the SBOM keep binding the digest).
        # A gate failure leaves the previous good :latest untouched.
        if: inputs.dry_run != true
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${IMAGE_OWNER}/firmware-tools:latest" \
            "$TOOLS_REF"
      - name: Record published image summary
        run: |
          {
            echo "## firmware images"
            echo
            echo "- **tools**: \`$TOOLS_REF\`"
            echo "- **tools digest**: \`$TOOLS_DIGEST\`"
            echo "- **tools tag**: \`$TOOLS_TAG\`"
            echo "- **workflow run**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Update digest lock and merge PR
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          SBOM_ATTESTATION_URL: ${{ steps.attest_sbom.outputs.attestation-url }}
        run: |
          set -euo pipefail
          retry() {
            # Transient GitHub API/server errors (HTTP 5xx, TLS resets,
            # truncated responses) should not hard-fail a multi-minute
            # publish: retry gh/git calls with backoff before giving up.
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          workflow_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The lock branch starts from the current main tip, not from the published
          # source commit, so the PR stays mergeable when main moved during the build.
          git fetch -q origin main
          base_sha=$(git rev-parse origin/main)
          branch="bot/update-image-digests-${TOOLS_DIGEST#sha256:}"
          branch="${branch:0:70}"
          git switch -q -c "$branch" "$base_sha"
          uv run python scripts/update_image_digest_lock.py --lock docker/image-digests.json \
            --entry firmware_tools --image "ghcr.io/${IMAGE_OWNER}/firmware-tools" \
            --tag "$TOOLS_TAG" --digest "$TOOLS_DIGEST" --published-at "$published_at" \
            --workflow-run "$workflow_run" --dockerfile docker/firmware-tools.Dockerfile \
            --attestation "$ATTESTATION_URL" \
            --sbom-attestation "$SBOM_ATTESTATION_URL" \
            --tools-json "$RUNNER_TEMP/firmware-tools.json"
          # Ship the same pin inside the plugin so an installed plugin can
          # resolve the tools image without the extension cache (the
          # launcher reads <plugin>/tools-image.json first).
          python3 - <<'PY'
          import json

          entry = json.load(open("docker/image-digests.json"))["firmware_tools"]
          pin = "plugins/firmware/tools-image.json"
          with open(pin, "w", encoding="utf-8") as out:
              json.dump(entry, out, indent=2)
              out.write("\n")
          PY
          # status --porcelain (not diff --quiet) so a still-untracked lock
          # file on the very first publish is detected as a change too.
          if [ -z "$(git status --porcelain -- docker/image-digests.json plugins/firmware/tools-image.json)" ]; then
            echo "Image digest lock is unchanged; no pull request is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker/image-digests.json plugins/firmware/tools-image.json
          git commit -m "Update firmware image digest lock"
          retry git push --set-upstream origin "$branch"
          body=$(printf '%s\n' \
            "The publish workflow updated the firmware image digest lock." \
            "" \
            "tools: ${TOOLS_REF}" \
            "workflow run: ${workflow_run}")
          # A stale bot PR from an earlier publish is superseded by this
          # run's digest: close it and delete its branch so it cannot
          # linger for manual review.
          for old_pr in $(retry gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName --jq '.[] | select(.headRefName | startswith("bot/update")) | .number' || true); do
            retry gh pr close "$old_pr" --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --delete-branch || true
          done
          pr_url=$(retry gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Update firmware image digest lock" --body "$body")
          echo "pin PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/publish_image_pin_pr.sh "$pr_url" "$branch" "" "ci.yml locked-image-check.yml"
      - name: Dry-run rehearsal summary
        if: always() && inputs.dry_run == true
        run: |
          {
            echo "## Publish dry-run rehearsal"
            echo
            echo "Built the tools image and ran the gate chain (Trivy scans,"
            echo "SBOM generation/packaging/guard, tool measurement, launcher"
            echo "smoke) against the local rehearsal tag. Skipped irreversible"
            echo "steps:"
            echo
            echo "- push of the immutable tag and :latest promotion"
            echo "- build-provenance and SBOM attestations"
            echo "- Trivy SARIF upload to code scanning"
            echo "- digest-lock PR and post-merge workflow dispatches"
          } >> "$GITHUB_STEP_SUMMARY"
