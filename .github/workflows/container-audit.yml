name: Container hardening audit

on:
  schedule:
    - cron: "52 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Pulls the pinned image from ghcr.io.
      packages: read
      # Uploads the Trivy SARIF scan to code scanning.
      security-events: write
      # Creates, edits, and closes the "Container hardening report" issue.
      issues: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and pull pinned image
        run: |
          set -euo pipefail
          # Resolve the firmware_tools entry explicitly: the alphabetical
          # first lock key would silently re-target the audit the day a
          # second image lands in the lock file.
          ref=$(python3 - <<'PY'
          import json, re, sys
          data = json.load(open("docker/image-digests.json", encoding="utf-8"))
          entry = data.get("firmware_tools") if isinstance(data, dict) else None
          if not isinstance(entry, dict):
              sys.exit("image digest lock has no firmware_tools entry")
          image, digest = entry.get("image"), entry.get("digest")
          if not isinstance(image, str) or not image.startswith("ghcr.io/"):
              sys.exit("firmware_tools lock entry has no ghcr.io image")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              sys.exit("firmware_tools digest must be a sha256:<64-hex> digest")
          print(f"{image}@{digest}")
          PY
          )
          echo "PINNED_IMAGE=$ref" >> "$GITHUB_ENV"
          # All Trivy invocations in this job share one DB cache so the
          # SARIF, JSON, and CIS scans do not re-download it; the
          # actions/cache step below persists it across weekly runs.
          echo "TRIVY_CACHE_DIR=$HOME/.cache/trivy" >> "$GITHUB_ENV"
          for attempt in 1 2 3 4 5; do
            if docker pull "$ref"; then break; fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::docker pull $ref failed after 5 attempts" >&2
              exit 1
            fi
            echo "docker pull attempt $attempt failed; retrying" >&2
            sleep $((attempt * 10))
          done
      - name: Resolve Trivy DB cache key
        id: trivy_week
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          # ISO-week key: the vulnerability DB refreshes daily upstream;
          # a weekly key bounds staleness while sharing the ~120MB
          # download across all three scans and across weekly runs.
          key: trivy-db-${{ runner.os }}-${{ steps.trivy_week.outputs.week }}
          restore-keys: |
            trivy-db-${{ runner.os }}-
      - name: Scan pinned image (Trivy SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          # The digest is frozen; the vulnerability DB is not — this scan
          # surfaces newly disclosed CVEs against the shipped tools image.
          scan-ref: ${{ env.PINNED_IMAGE }}
          version: v0.75.0
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
      - name: Scan pinned image (Trivy JSON, full)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ env.PINNED_IMAGE }}
          version: v0.75.0
          scanners: vuln,secret,misconfig,license
          exit-code: '0'
          format: json
          output: trivy-image.json
          skip-setup-trivy: true
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-firmware-tools-audit
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      - name: Run Docker CIS compliance report
        run: |
          set -euo pipefail
          # trivy exits 0 even when a mirror flake yields an empty Results
          # payload, so the retry keys on content, not the exit code.
          for attempt in 1 2; do
            trivy image --compliance docker-cis-1.6.0 --report all \
              --format json --output "$RUNNER_TEMP/trivy-cis.json" \
              "${PINNED_IMAGE}"
            if jq -e '[.. | objects | .MisconfSummary? // empty | (.Successes // 0) + (.Failures // 0)] | add > 0' \
              "$RUNNER_TEMP/trivy-cis.json" >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Docker CIS scan produced an empty results payload after retry" >&2
              exit 1
            fi
            echo "CIS scan returned an empty results payload; retrying once" >&2
            sleep 15
          done
      - name: Run informational Lynis audit inside the image
        id: lynis
        continue-on-error: true
        env:
          LYNIS_OUT: ${{ runner.temp }}/lynis-out
        run: |
          set -uo pipefail
          git clone --depth 1 --branch 3.1.7 \
            https://github.com/CISOfy/lynis "$RUNNER_TEMP/lynis"
          # The 3.1.7 tag is mutable; verify the checked-out commit is the
          # pinned SHA so a re-tagged release cannot inject different code.
          head=$(git -C "$RUNNER_TEMP/lynis" rev-parse HEAD)
          if [ "$head" != "2e99f92265760b73fd6b139868eb8d4116624030" ]; then
            echo "::error::lynis 3.1.7 tag moved (HEAD=$head); refusing to run it" >&2
            exit 1
          fi
          mkdir -p "$LYNIS_OUT"
          docker run --rm --user 0 \
            -v "$RUNNER_TEMP/lynis:/lynis:ro" \
            -v "$GITHUB_WORKSPACE/docker/lynis-container.prf:/container.prf:ro" \
            -v "$LYNIS_OUT:/out" \
            --entrypoint /bin/sh "$PINNED_IMAGE" \
            -c 'cd /lynis && ./lynis audit system --quick --no-colors \
                --profile /container.prf \
                --report-file /out/lynis-report.dat --logfile /out/lynis.log \
                --auditor github-actions; \
                # Lynis writes its outputs with umask 027 (0640 root-owned):
                # loosen them so the runner-side grep below can read them.
                chmod 644 /out/lynis-report.dat /out/lynis.log 2>/dev/null' || true
          index=$(grep '^hardening_index=' "$LYNIS_OUT/lynis-report.dat" \
            | head -1 | cut -d= -f2 || true)
          warnings=$(grep -c '^warning\[\]' "$LYNIS_OUT/lynis-report.dat" || true)
          printf 'hardening_index=%s\nwarnings=%s\n' \
            "${index:-unknown}" "${warnings:-0}" >> "$GITHUB_OUTPUT"
      - name: Compute container-hardening report
        env:
          LYNIS_OUT: ${{ runner.temp }}/lynis-out
          TRIVY_JSON: trivy-image.json
          TRIVY_CIS: ${{ runner.temp }}/trivy-cis.json
          REPORT_JSON: container-hardening.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from collections import Counter
          trivy = json.load(open(os.environ["TRIVY_JSON"], encoding="utf-8"))
          vulns, secrets, licenses = Counter(), Counter(), 0
          mis_pass = mis_total = 0
          fixable_high = 0
          for result in trivy.get("Results", []):
              for v in result.get("Vulnerabilities") or []:
                  sev = v.get("Severity", "UNKNOWN").lower()
                  fixed = bool(v.get("FixedVersion"))
                  vulns[sev] += 1
                  if fixed:
                      vulns[f"{sev}_fixed"] += 1
                      if sev in ("critical", "high"):
                          fixable_high += 1
              mis = result.get("Misconfigurations") or []
              for m in mis:
                  mis_total += 1
                  if m.get("Status") == "PASS":
                      mis_pass += 1
              for s in result.get("Secrets") or []:
                  secrets[s.get("Severity", "UNKNOWN").lower()] += 1
              for lic in result.get("Licenses") or []:
                  licenses += 1
          cis = {"passed": 0, "failed": 0}
          failed_checks: list[str] = []
          try:
              cis_data = json.load(open(os.environ["TRIVY_CIS"], encoding="utf-8"))
          except (OSError, ValueError):
              cis_data = {}
          # trivy --compliance nests check summaries deeper than top-level
          # Results; walk the tree so the CIS leg cannot silently no-op.
          def _summaries(node):
              yield node
              for child in node.get("Results") or []:
                  yield from _summaries(child)
          for result in _summaries(cis_data):
              summary = result.get("MisconfSummary") or {}
              cis["passed"] += int(summary.get("Successes", 0))
              cis["failed"] += int(summary.get("Failures", 0))
              for m in result.get("Misconfigurations") or []:
                  if m.get("Status") == "FAIL":
                      failed_checks.append(m.get("ID") or m.get("Title") or "?")
          cis["failed_checks"] = sorted(set(failed_checks))
          if cis["passed"] + cis["failed"] == 0:
              # dead telemetry must fail, not masquerade as coverage
              sys.exit("Docker CIS scan produced no results")
          lynis = {"hardening_index": "unknown", "warnings": 0}
          try:
              for line in open(os.environ["LYNIS_OUT"] + "/lynis-report.dat",
                               encoding="utf-8", errors="replace"):
                  if line.startswith("hardening_index="):
                      lynis["hardening_index"] = line.split("=", 1)[1].strip()
                  elif line.startswith("warning[]"):
                      lynis["warnings"] += 1
          except OSError:
              pass
          image, _, digest = os.environ["PINNED_IMAGE"].partition("@")
          report = {
              "image": image,
              "digest": digest,
              "trivy": {
                  "critical": vulns["critical"],
                  "high": vulns["high"],
                  "medium": vulns["medium"],
                  "low": vulns["low"],
                  "fixable_high_or_critical": fixable_high,
                  "misconfig_pass": mis_pass,
                  "misconfig_total": mis_total,
                  "secrets": sum(secrets.values()),
                  "license_findings": licenses,
              },
              "cis_docker": cis,
              "lynis": lynis,
              "gate": {"fixable_high_or_critical": fixable_high},
          }
          with open(os.environ["REPORT_JSON"], "w", encoding="utf-8") as fh:
              json.dump(report, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Upload hardening report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-tools-audit
          path: |
            container-hardening.json
            trivy-image.json
          retention-days: 90
      - name: Post report to issue
        # Runs even when a later artifact step failed so a mid-job outage
        # still posts the computed report; skipped only when the report
        # itself was never produced.
        if: always() && hashFiles('container-hardening.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_JSON: container-hardening.json
          REPORT_MD: ${{ runner.temp }}/hardening-report.md
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$REPORT_MD"
          import json, os
          r = json.load(open(os.environ["REPORT_JSON"], encoding="utf-8"))
          t = r["trivy"]
          print(f"# Container hardening report\n")
          print(f"Image: `{r['image']}`\nDigest: `{r['digest']}`\n")
          print("| Metric | Value |")
          print("|---|---|")
          print(f"| Trivy vulns C/H/M/L | {t['critical']}/{t['high']}/{t['medium']}/{t['low']} |")
          print(f"| Fixable HIGH+CRITICAL | {t['fixable_high_or_critical']} |")
          print(f"| Misconfig pass | {t['misconfig_pass']}/{t['misconfig_total']} |")
          print(f"| Secrets found | {t['secrets']} |")
          print(f"| CIS Docker pass/fail | {r['cis_docker']['passed']}/{r['cis_docker']['failed']} |")
          if r['cis_docker'].get('failed_checks'):
              print(f"| CIS failed controls | {', '.join(r['cis_docker']['failed_checks'])} |")
          print(f"| Lynis hardening index (trend only) | {r['lynis']['hardening_index']} |")
          print(f"| Lynis warnings | {r['lynis']['warnings']} |")
          print(f"\nRun: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          PY
          gh label create container-hardening --repo "$GITHUB_REPOSITORY" \
            --color d93f0b --description "Container hardening report" --force
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label container-hardening \
            --search "in:title Container hardening report" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT_MD"
          else
            number=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Container hardening report" \
              --label container-hardening --body-file "$REPORT_MD" | sed 's#.*/##')
          fi
          # The issue only closes when nothing is left to act on: fixable
          # HIGH/CRITICAL CVEs or any failed CIS control keep it open.
          read -r gate cis_failed <<< "$(python3 -c 'import json, os; r=json.load(open(os.environ["REPORT_JSON"], encoding="utf-8")); print(r["gate"]["fixable_high_or_critical"], r["cis_docker"]["failed"])')"
          if [ "$gate" = "0" ] && [ "$cis_failed" = "0" ] && [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "No fixable HIGH/CRITICAL findings remain."
          fi
