name: CI

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          # The publish-owned digest locks change on every image publish;
          # rebuilding the e2e image for a metadata-only pin is pure cost
          # (the publish smoke already gated that image), so they count as
          # non-code like docs.
          if grep -Ev '^(docs/|[^/]+\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md$|docker/image-digests\.json$|plugins/firmware/tools-image\.json$)' "$RUNNER_TEMP/changed-files" >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # Forward-compatibility canary ahead of the 2026-10-09 stable
          # release: step-level continue-on-error keeps the leg green while
          # the last step reports the failure as an annotation.
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        continue-on-error: ${{ matrix.experimental || false }}
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: verify-${{ matrix.python-version }}
      - name: Sync dependencies
        id: sync-dependencies
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv sync --locked
      # Seven independent check legs: each keeps its own id/continue-on-error
      # for the 3.15 canary outcome report, so they run as top-level
      # background steps (a parallel group would hide the ids from
      # actionlint's expression check) and join at the wait below.
      - name: Shared hooks
        id: shared-hooks
        continue-on-error: ${{ matrix.experimental || false }}
        background: true
        run: uv run python scripts/check_shared_hooks.py
      - name: Check shared workflows
        id: check-shared-workflows
        continue-on-error: ${{ matrix.experimental || false }}
        background: true
        run: uv run python scripts/check_shared_workflows.py
      - name: Ruff
        id: ruff
        continue-on-error: ${{ matrix.experimental || false }}
        background: true
        run: uv run ruff check . && uv run ruff format --check .
      - name: Pyright
        id: pyright
        continue-on-error: ${{ matrix.experimental || false }}
        background: true
        run: uv run pyright
      - name: Pytest
        id: pytest
        continue-on-error: ${{ matrix.experimental || false }}
        background: true
        run: uv run python scripts/structural_coverage.py run --json out/structural-coverage.json
      - name: Plugin load (OpenHands SDK)
        id: plugin-load-openhands-sdk
        continue-on-error: ${{ matrix.experimental || false }}
        background: true
        env:
          OPENHANDS_SUPPRESS_BANNER: "1"
        run: uv run --group sdk-check python scripts/check_plugin_load.py
      - name: Docs
        id: docs
        continue-on-error: ${{ matrix.experimental || false }}
        background: true
        run: uv run python scripts/verify_docs.py
      - name: Wait for check legs
        wait-all: true

      - name: Report 3.15 canary outcome
        if: matrix.experimental && (steps.setup-uv.outcome == 'failure' || steps.sync-dependencies.outcome == 'failure' || steps.shared-hooks.outcome == 'failure' || steps.check-shared-workflows.outcome == 'failure' || steps.ruff.outcome == 'failure' || steps.pyright.outcome == 'failure' || steps.pytest.outcome == 'failure' || steps.plugin-load-openhands-sdk.outcome == 'failure' || steps.docs.outcome == 'failure')
        run: |
          echo "::warning::Python 3.15 canary leg failed — forward-compat signal, not a gate failure"
  dockerfile-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # Hadolint is read-only on docker/**: overlap it with the BuildKit
      # setup + --check and join it before the job ends.
      - name: Lint Dockerfiles with hadolint
        id: hadolint
        background: true
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/firmware-tools.Dockerfile
          recursive: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run BuildKit checks
        run: docker build --check -f docker/firmware-tools.Dockerfile .
      - name: Wait for hadolint
        wait: hadolint

  e2e-contracts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      contracts: ${{ steps.list.outputs.contracts }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # Every examples/<name>/<name>.fw.json becomes one matrix leg, so new
      # examples parallelize automatically.
      - id: list
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob
          import json
          import re

          contracts = []
          for path in sorted(glob.glob("examples/*/*.fw.json")):
              name = path.split("/")[1]
              if re.fullmatch(r"[a-z0-9][a-z0-9-]*", name) is None:
                  raise SystemExit(f"unexpected example dir name: {name}")
              contracts.append({"name": name, "contract": path})
          if not contracts:
              raise SystemExit("no example contracts found under examples/")
          print("contracts=" + json.dumps(contracts))
          PY

  e2e-contract:
    name: e2e (${{ matrix.name }})
    needs: [changes, e2e-contracts]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Writes the shared registry buildcache on push/dispatch runs; fork-PR
      # tokens are clamped to read-only regardless.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-contracts.outputs.contracts) }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The GHCR buildcache survives the gha cache's eviction window and is
      # readable by pull_request runs, where most cold builds happened. The
      # cache lives as a `buildcache` tag on the public firmware-tools package
      # so anonymous pulls (fork PRs and local `docker buildx --cache-from`)
      # reuse it too; a separate -buildcache package would default to private.
      - name: Log in to GHCR for the registry build cache
        id: ghcr-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build firmware-tools image
        # Each leg warms the image from the shared caches instead of
        # transferring it between jobs. Without a GHCR login (fork PRs) the
        # gha cache remains the read/write fallback, matching the old path.
        env:
          GHCR: ${{ steps.ghcr-login.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          args=(
            docker buildx build --load
            -f docker/firmware-tools.Dockerfile -t firmware-tools:ci
            --build-arg "IMAGE_REVISION=${{ github.sha }}"
            --cache-from "type=gha,scope=firmware-tools"
          )
          if [ "$GHCR" = "true" ]; then
            args+=(--cache-from "type=registry,ref=ghcr.io/$owner/firmware-tools:buildcache")
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            if [ "$GHCR" = "true" ]; then
              args+=(--cache-to "type=registry,ref=ghcr.io/$owner/firmware-tools:buildcache,mode=max")
            else
              args+=(--cache-to "type=gha,mode=max,scope=firmware-tools")
            fi
          fi
          "${args[@]}" .
      # The gate run and the debug trace regenerate the same contract's
      # derived artifacts (fw-pinmap.json, out/, sim logs, observations
      # appends) inside the mounted workspace, so they stay sequential.
      - name: Full gates in the image (no network)
        env:
          FIRMWARE_TOOLS_IMAGE: firmware-tools:ci
          FIRMWARE_SRC: ${{ github.workspace }}/src
          OPENHANDS_PROJECT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          launcher=plugins/firmware/scripts/firmware_launcher.py
          python3 "$launcher" doctor | tee doctor.json
          # One contract per matrix leg; the loop keeps the original gate
          # loop's shape so the workflow-path tests still recognize it.
          for contract in ${{ matrix.contract }}; do
            if python3 "$launcher" gates "$contract" > report.json; then
              gate_status=0
            else
              gate_status=$?
            fi
            if [ "$gate_status" -ne 0 ]; then
              # The gate's crash detail lives in its redirected stdout —
              # echo it so the log explains which contract broke.
              echo "gates exited $gate_status for $contract; captured output:"
              cat report.json || true
            fi
            python3 - report.json "$gate_status" <<'PY'
          import json, sys
          from pathlib import Path
          report_path = Path(sys.argv[1])
          gate_status = int(sys.argv[2])
          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, ValueError) as exc:
              if report_path.is_file():
                  print(report_path.read_text(encoding="utf-8", errors="replace"), end="")
              sys.exit(f"gates produced no parseable report (exit {gate_status}): {exc}")
          for check in report["checks"]:
              print(f"{check['id']:24} {check['status']:8} {check['detail'][:200]}")
          sys.exit(0 if gate_status == 0 and report["verdict"] == "pass" else 1)
          PY
          done
      - name: Debug trace against desk-lamp contract
        if: matrix.name == 'desk-lamp-s3'
        env:
          FIRMWARE_TOOLS_IMAGE: firmware-tools:ci
          FIRMWARE_SRC: ${{ github.workspace }}/src
          OPENHANDS_PROJECT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          launcher=plugins/firmware/scripts/firmware_launcher.py
          python3 "$launcher" debug examples/desk-lamp-s3/desk-lamp.fw.json \
            --id lamp_selftest --break lamp_step > debug.json
          python3 -c "import json,sys; d=json.load(open('debug.json')); print(d['verdict'], d.get('stops')); sys.exit(0 if d['verdict']=='pass' and d.get('stops') else 1)"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fw-reports-${{ matrix.name }}
          path: examples/${{ matrix.name }}/fw-reports/

  e2e:
    needs: [changes, e2e-contracts, e2e-contract]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Aggregate e2e results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          legs = ("e2e-contracts", "e2e-contract")
          results = {name: needs[name]["result"] for name in legs}
          # Out of scope the legs are skipped by design; in scope every leg
          # must succeed so a skipped-leg-needs-failure cannot masquerade.
          expected = "success" if needs["changes"]["outputs"].get("code") == "true" else "skipped"
          bad = {k: v for k, v in results.items() if v != expected}
          for name in legs:
              print(f"{name}: {results[name]}")
          if bad:
              print(f"::error::e2e legs not {expected}: {bad}")
              sys.exit(1)
          PY
